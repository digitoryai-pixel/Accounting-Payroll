services:
  # ---- Nginx Reverse Proxy (port 80) ----
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - digitory-network

  # ---- Backend API (Express, port 3000 internal) ----
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=/api/v1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=digitory_financial
      - DB_USER=digitory
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-production-secret-change-me}
      - RUN_SEED=${RUN_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - digitory-network

  # ---- Frontend (Next.js, port 3001 internal) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - digitory-network

  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digitory_financial
      POSTGRES_USER: digitory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitory -d digitory_financial"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - digitory-network

  # ---- Redis Cache ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - digitory-network

volumes:
  postgres-data:
  redis-data:

networks:
  digitory-network:
    driver: bridge
